# deployment/staging/nginx.conf
# Relative operator files resolve under the selected nginx prefix; never commit keys/passwords.
worker_processes 1;
events { worker_connections 256; }
http {
  include mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log logs/error.log crit;
  server_tokens off;
  client_max_body_size 256k;
  client_body_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 240s;
  server {
    listen 127.0.0.1:8443 ssl;
    server_name localhost;
    ssl_certificate conf/operator/staging.crt;
    ssl_certificate_key conf/operator/staging.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Aurvin controlled staging";
    auth_basic_user_file conf/operator/staging.htpasswd;
    root html/aurvin;
    add_header Cache-Control "no-store, no-transform" always;
    add_header X-Content-Type-Options nosniff always;
    location /api/operations/ {
      allow 127.0.0.1;
      deny all;
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Authorization "";
      proxy_set_header X-Request-ID "";
      proxy_buffering off;
      proxy_cache off;
      proxy_connect_timeout 10s;
      proxy_read_timeout 240s;
      proxy_send_timeout 240s;
    }
    # Dictation-only WebSocket; live WebRTC media/control use separate approved LiveKit endpoints.
    # This is a dictation-only proxy; it does not carry LiveKit media.
    # Requirements: docs/live-voice-webrtc/operations.md (no SFU listener is configured here).
    location = /api/voice {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header Authorization "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Request-ID "";
      proxy_buffering off;
      proxy_cache off;
      proxy_connect_timeout 10s;
      proxy_read_timeout 1260s;
      proxy_send_timeout 1260s;
    }
    location /api/ {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Authorization "";
      proxy_set_header X-Request-ID "";
      proxy_set_header X-Forwarded-For "";
      proxy_buffering off;
      proxy_request_buffering on;
      proxy_cache off;
      proxy_connect_timeout 10s;
      proxy_read_timeout 240s;
      proxy_send_timeout 240s;
    }
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
